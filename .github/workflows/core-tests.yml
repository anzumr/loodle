name: Core tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore tests/Core.Tests/Core.Tests.csproj --locked-mode
      - run: dotnet test tests/Core.Tests/Core.Tests.csproj --no-restore --configuration Release --logger "trx;LogFileName=core-tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: tests/Core.Tests/TestResults/*.trx
